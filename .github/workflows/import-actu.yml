name: Importer les actus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "actu/**"
      - "scripts/import-actu.mjs"
      - "scripts/actu-lib.mjs"
      - ".github/workflows/import-actu.yml"

concurrency:
  group: import-actu
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Vérifier les actus (sans accès à la base)
        working-directory: scripts
        run: node test_actu.mjs
      - name: Installer firebase-admin
        working-directory: scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Préparer la clé (supprimée en fin de tâche)
        env:
          CLE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLE" ]; then echo "Secret FIREBASE_SERVICE_ACCOUNT absent"; exit 1; fi
          umask 077
          printf '%s' "$CLE" > "$RUNNER_TEMP/sa.json"
      - name: Importer
        working-directory: scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node import-actu.mjs
      - name: Supprimer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
