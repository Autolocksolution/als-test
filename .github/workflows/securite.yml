name: Sondes de sécurité
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Installer
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Préparer la clé
        env: { CLE: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: printf '%s' "$CLE" > "$RUNNER_TEMP/sa.json"
      - name: Exécuter
        working-directory: scripts
        env: { GOOGLE_APPLICATION_CREDENTIALS: "${{ runner.temp }}/sa.json" }
        run: node securite.mjs
      - name: Publier le rapport
        if: always()
        run: |
          git config user.name robot; git config user.email robot@users.noreply.github.com
          git checkout --orphan data-securite; git rm -rf . -q; git add -f securite*.json
          git commit -qm rapport; git push -f origin data-securite
      - name: Supprimer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
