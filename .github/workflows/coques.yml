name: Coques de clé Neoriv
on:
  workflow_dispatch:
    inputs:
      mode: { description: "dry ou apply", default: dry }
      cats: { description: "ids de catégories Neoriv, séparés par des virgules", default: "" }
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Installer
        working-directory: scripts
        run: npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund sharp
      - name: Préparer la clé
        env: { CLE: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" }
        run: printf '%s' "$CLE" > "$RUNNER_TEMP/sa.json"
      - name: Exécuter
        working-directory: scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          MODE: ${{ github.event.inputs.mode }}
          CATS: ${{ github.event.inputs.cats }}
        run: node coques.mjs
      - name: Publier le rapport
        if: always()
        run: |
          git config user.name robot; git config user.email robot@users.noreply.github.com
          git checkout --orphan data-coques; git rm -rf . -q; git add -f coques*.json
          git commit -qm rapport; git push -f origin data-coques
      - name: Supprimer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
