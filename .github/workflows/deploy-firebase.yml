name: Déployer les règles Firebase

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "scripts/gen-rules.mjs"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Installer firebase-admin (avant de déposer la clé)
        working-directory: scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Préparer la clé (supprimée en fin de tâche)
        env:
          CLE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLE" ]; then echo "Secret FIREBASE_SERVICE_ACCOUNT absent"; exit 1; fi
          printf '%s' "$CLE" > "$RUNNER_TEMP/sa.json"
      - name: Générer et tester les règles (échec = rien n'est publié)
        working-directory: scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node gen-rules.mjs
      - name: Déployer les règles Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13 deploy --only firestore:rules --project autlocksolution --non-interactive
      - name: Supprimer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
