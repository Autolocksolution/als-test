name: Base véhicules pré-remplie

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "apercu = chercher les photos et produire les planches ; import = créer les fiches"
        required: true
        type: choice
        options: [apercu, import, enrichit]
      retry:
        description: "1 = relancer seulement les recherches marquées q dans choix"
        required: false
        default: ""
      lot:
        description: "Lot de marques (fr, ...)"
        required: true
        default: fr

concurrency:
  group: base-vehicules
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Installer
        working-directory: scripts
        run: npm install --ignore-scripts --no-audit --no-fund && npm install --ignore-scripts --no-audit --no-fund --no-save sharp@0.33.5
      - name: Tests
        working-directory: scripts
        run: node test_base_vehicules.mjs
      - name: Aperçu des photos
        if: github.event.inputs.mode == 'apercu'
        working-directory: scripts
        env:
          MODE: apercu
          LOT: ${{ github.event.inputs.lot }}
          RETRY: ${{ github.event.inputs.retry }}
        run: node base-vehicules.mjs
      - name: Publier l'aperçu
        if: github.event.inputs.mode == 'apercu'
        run: |
          git config user.name "robot-base"
          git config user.email "robot-base@users.noreply.github.com"
          git add scripts/base-vehicules/
          git commit -m "Aperçu base véhicules (${{ github.event.inputs.lot }})"
          git pull -q --rebase origin main
          git push
      - name: Préparer la clé de service (supprimée en fin de tâche)
        if: github.event.inputs.mode == 'import' || github.event.inputs.mode == 'enrichit'
        env:
          CLE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLE" ]; then echo "Secret FIREBASE_SERVICE_ACCOUNT absent"; exit 1; fi
          umask 077
          printf '%s' "$CLE" > "$RUNNER_TEMP/sa.json"
      - name: Importer
        if: github.event.inputs.mode == 'import'
        working-directory: scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          MODE: import
          LOT: ${{ github.event.inputs.lot }}
        run: node base-vehicules.mjs
      - name: Compléter les fiches
        if: github.event.inputs.mode == 'enrichit'
        working-directory: scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          MODE: enrichit
        run: node base-vehicules.mjs
      - name: Supprimer la clé de service
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
