name: Diagnostic des appareils (lecture seule, rapport chiffré)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Installer
        working-directory: scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Clé de service (supprimée en fin de tâche)
        env:
          CLE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLE" ]; then echo "Secret FIREBASE_SERVICE_ACCOUNT absent"; exit 1; fi
          umask 077
          printf '%s' "$CLE" > "$RUNNER_TEMP/sa.json"
      - name: Diagnostic
        working-directory: scripts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          OUT_DIR: ${{ runner.temp }}/diag
        run: node diag-appareils.mjs
      - name: Supprimer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
      - name: Publier le rapport chiffré (gardé 1 jour)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appareils
          path: ${{ runner.temp }}/diag/appareils.enc.json
          retention-days: 1
          if-no-files-found: error
