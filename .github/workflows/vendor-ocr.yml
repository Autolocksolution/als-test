name: Installer le lecteur de tickets (OCR)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Récupérer tesseract.js (version figée) et la langue française
        run: |
          mkdir -p ocr tmp && cd tmp
          npm init -y >/dev/null
          npm install --no-audit --no-fund tesseract.js@5.1.1
          cp node_modules/tesseract.js/dist/tesseract.min.js node_modules/tesseract.js/dist/worker.min.js ../ocr/
          cp node_modules/tesseract.js-core/tesseract-core-simd-lstm.wasm* node_modules/tesseract.js-core/tesseract-core-lstm.wasm* ../ocr/
          curl -fsSL -o ../ocr/fra.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/fra.traineddata
          gzip -9 -f ../ocr/fra.traineddata
          ls -la ../ocr
          cat node_modules/tesseract.js/package.json | grep '"version"'
          cat node_modules/tesseract.js-core/package.json | grep '"version"'
      - name: Enregistrer dans le dépôt
        run: |
          rm -rf tmp
          git config user.name robot; git config user.email robot@users.noreply.github.com
          git add ocr && git commit -m "OCR : tesseract.js 5.1.1 + français (fast)" && git push
