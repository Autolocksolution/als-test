name: Audit des dépendances

# Chaque lundi : cherche les failles connues dans les bibliothèques du robot.
# La tâche passe au rouge (et GitHub t'envoie un e-mail) si une faille importante est trouvée.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/package.json"
      - ".github/workflows/audit-dependances.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Installer sans exécuter de script
        working-directory: scripts
        run: npm install --ignore-scripts --no-fund --silent
      - name: Chercher les failles connues
        working-directory: scripts
        run: npm audit --omit=dev --audit-level=high
