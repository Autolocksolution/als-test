name: Audit des dépendances

# Chaque lundi : cherche les failles connues dans les bibliothèques du robot.
# La tâche passe au rouge (et GitHub t'envoie un e-mail) si une faille importante est trouvée.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/package.json"
      - ".github/workflows/audit-dependances.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Installer sans exécuter de script
        working-directory: scripts
        run: npm install --ignore-scripts --no-fund --silent
      - name: Chercher les failles connues
        working-directory: scripts
        run: npm audit --omit=dev --audit-level=high
