<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test iPhone</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ALS test"><meta name="theme-color" content="#2F7F7A">
<style>body{font:17px/1.45 -apple-system,system-ui,sans-serif;margin:0;padding:24px 16px;background:#F5F7F7;color:#1E2B31}
main{max-width:480px;margin:auto}h1{font-size:24px;margin:0 0 4px}button{width:100%;height:52px;border-radius:12px;border:0;background:#2F7F7A;color:#fff;font-size:17px;font-weight:600;margin:10px 0}
.box{background:#fff;border:1px solid #E1E7E8;border-radius:12px;padding:12px 14px;margin:12px 0}.ok{color:#1b7a3a}.ko{color:#b3261e}small{color:#65757D}pre{white-space:pre-wrap;font-size:14px}</style></head><body><main>
<h1>Test iPhone</h1><small>Page de test, sans données. Sert à vérifier l'icône et les notifications.</small>
<div class="box"><b>Diagnostic</b><pre id="diag">…</pre></div>
<button id="b1">1. Activer les notifications</button>
<button id="b2">2. Envoyer une notification de test</button>
<div class="box"><b>Journal</b><pre id="log"></pre></div>
</main><script>
const $=id=>document.getElementById(id),log=t=>$("log").textContent+=t+"\n";
const standalone=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
function diag(){
 const l=[];
 l.push((standalone?"OK ":"KO ")+"Ouverte depuis l'icône de l'écran d'accueil : "+(standalone?"oui":"non (ajoute-la d'abord à l'écran d'accueil)"));
 l.push(("serviceWorker" in navigator?"OK ":"KO ")+"Service worker : "+("serviceWorker" in navigator?"disponible":"absent"));
 l.push(("Notification" in window?"OK ":"KO ")+"Notifications : "+("Notification" in window?("permission = "+Notification.permission):"non disponibles dans ce mode"));
 l.push(("PushManager" in window?"OK ":"KO ")+"Push : "+("PushManager" in window?"disponible":"non disponible"));
 l.push("Appareil : "+navigator.userAgent.replace(/\).*/,")").slice(0,90));
 $("diag").textContent=l.join("\n");
}
diag();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(()=>log("Service worker enregistré")).catch(e=>log("Service worker : erreur "+e.message));
$("b1").onclick=async()=>{try{if(!("Notification" in window)){log("Notifications indisponibles ici");return}
 const r=await Notification.requestPermission();log("Permission : "+r);diag()}catch(e){log("Erreur : "+e.message)}};
$("b2").onclick=async()=>{try{const reg=await navigator.serviceWorker.ready;
 await reg.showNotification("AutoLockSolution",{body:"Test réussi : tu reçois bien les notifications.",icon:"icon-192.png"});log("Notification envoyée (verrouille l'écran pour voir si elle arrive aussi)")}catch(e){log("Erreur : "+e.message)}};
</script></body></html>
